[package]
name = "titan"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Experimental Rust game engine for agent-driven development."

[workspace]
members = ["crates/titan-browser", "crates/titan-cli", "crates/titan-diagnostics", "crates/titan-macros", "crates/titan-protocol", "crates/titan-remote", "crates/titan-render-wgpu", "fixtures/generated-asset"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/titan-engine/titan"
publish = false

[features]
default = ["image-png"]
image-png = ["dep:png"]

[dependencies]
png = { version = "0.18", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
titan-macros = { path = "crates/titan-macros" }
titan-protocol = { path = "crates/titan-protocol" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
titan-diagnostics = { path = "crates/titan-diagnostics" }
ctrlc = { version = "3", features = ["termination"] }
titan-remote = { path = "crates/titan-remote" }
pollster = "0.4"
winit = "0.30"
titan-render-wgpu = { path = "crates/titan-render-wgpu" }
trybuild = "1"

# These hosts load PNG files at startup; procedural-only library users can
# disable default features without compiling asset-dependent examples.

[[example]]
name = "procedural_rpg"
required-features = ["image-png"]

[[example]]
name = "play_rpg"
required-features = ["image-png"]

[[example]]
name = "replay_rpg"
required-features = ["image-png"]

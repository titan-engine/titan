[package]
name = "titan_doom"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "A small Doom-style Titan demo with shared headless and human controls"
repository = "https://github.com/titan-engine/titan"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = ["render"]
render = [
  "bevy/async_executor",
  "bevy/multi_threaded",
  "bevy/bevy_asset",
  "bevy/bevy_scene",
  "bevy/bevy_log",
  "bevy/bevy_window",
  "bevy/bevy_winit",
  "bevy/bevy_render",
  "bevy/bevy_camera",
  "bevy/bevy_color",
  "bevy/bevy_image",
  "bevy/bevy_mesh",
  "bevy/bevy_light",
  "bevy/bevy_shader",
  "bevy/bevy_core_pipeline",
  "bevy/bevy_pbr",
  "bevy/bevy_ui",
  "bevy/bevy_ui_render",
  "bevy/bevy_text",
  "bevy/default_font",
  "bevy/png",
  "bevy/x11",
  "titan_remote?/render",
]
remote = ["bevy/bevy_remote", "dep:bevy_render", "dep:titan_remote"]

[dependencies]
bevy = { path = "../..", version = "0.20.0", default-features = false, features = [
  "std",
] }
serde = { version = "1", features = ["derive"] }
ron = "0.12"
titan_remote = { path = "../../crates/titan_remote", optional = true }
# BRP already depends on this crate; use RenderApp even when Doom's render feature
# is off, so an embedding app cannot accidentally expose a second BRP listener.
bevy_render = { path = "../../crates/bevy_render", version = "0.20.0", optional = true }

[dev-dependencies]
titan_test = { path = "../../crates/titan_test" }
tempfile = "3"
serde_json = "1"
ureq = { version = "3.0.8", default-features = false, features = ["json"] }

[[bin]]
name = "titan_doom"
path = "src/main.rs"
required-features = ["render"]

[lints]
workspace = true

name: Browser demos

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build public browser demos
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install supported Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install supported Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Install pinned Rust
        run: |
          # rustup reads the channel, components and targets from rust-toolchain.toml.
          rustup toolchain install
          # External copied games must use the same toolchain as this checkout.
          rustup default "$(rustup show active-toolchain | cut -d ' ' -f 1)"
          rustc --version
          cargo --version
          python3 --version
          node --version
      - name: Build allowlisted static site
        run: |
          python3 scripts/test-pages.py
          python3 scripts/build-pages.py
      - name: Verify the compiled games
        run: |
          node scripts/test-browser.mjs
          node games/arena/scripts/test-browser.mjs
          node games/collection-room/scripts/test-browser.mjs
      - name: Upload public site
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/pages

  deploy:
    name: Publish browser demos
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages-deployment
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

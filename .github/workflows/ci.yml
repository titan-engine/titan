name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# Only superseded runs of the same PR cancel each other. Main and manual runs
# and merge-group runs have unique groups so independent integrations never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

defaults:
  run:
    shell: python3 scripts/ci-deadline.py {0}

jobs:
  native:
    name: Native checks
    # 45-minute shared command budget + 10 minutes for evidence/actions cleanup.
    timeout-minutes: 55
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Identify Rust build cache
        id: rust-cache
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import hashlib, os, subprocess
          identity = subprocess.check_output(["rustc", "-vV"]) + os.environ.get("ImageOS", "").encode()
          print("version=" + hashlib.sha256(identity).hexdigest())
          PYTHON

      # Cache build outputs, never target/titan runtime captures or discovery data.
      # Copied games retain their own target directories and still build and run.
      - name: Cache Cargo downloads and Rust builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            target/debug
            target/starter-smoke/debug
            games/arena/target/debug
          key: rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.rust-cache.outputs.version }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.rust-cache.outputs.version }}-

      - name: Verify acceptance process timeout and cleanup
        run: |
          python3 scripts/test-acceptance-process.py
          python3 scripts/test-ci-deadline.py
          node --test scripts/acceptance_process.test.mjs

      - name: Check portable build tooling policy
        run: python3 scripts/test-build-tools.py

      - name: Verify bounded acceptance failure evidence
        run: python3 scripts/test-acceptance-evidence.py

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check procedural-only core
        run: cargo check -p titan --lib --no-default-features

      - name: Run all tests and examples
        run: cargo test --workspace --all-targets

      - name: Exercise bounded PNG corpus and generated inputs
        run: |
          python3 scripts/test-png-fuzz-runner.py
          python3 scripts/fuzz-png.py --seed 69 --iterations 1000

      - name: Upload PNG fuzz failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: png-fuzz-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/png-fuzz/run-*/*
          retention-days: 7
          if-no-files-found: ignore

      - name: Verify swarm measurement runner
        run: |
          python3 scripts/test-swarm-measurement.py
          python3 scripts/measure-swarm.py --debug --counts 0 32 --steps 8 --repeats 1
          python3 scripts/measure-swarm.py --debug --counts 0 32 --steps 8 --repeats 1 --threads 2

      - name: Verify sparse component retention smoke workload
        run: |
          python3 scripts/test-sparse-churn-measurement.py
          python3 scripts/measure-sparse-churn.py --debug --counts 1 32 --cycles 3 --repeats 2

      - name: Verify mixed-schedule measurement runner
        run: |
          python3 scripts/test-mixed-schedule-measurement.py
          python3 scripts/measure-mixed-schedules.py --debug --counts 0 16 --steps 2 --work-iterations 1 --repeats 1 --threads 1 2 4

      - name: Verify generated asset cache across processes
        run: python3 scripts/test-generated-assets.py

      - name: Run Clippy with warnings denied
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Smoke-test structured CLI output
        run: cargo run --quiet -p titan-cli -- --format json info

      - name: Exercise the native RPG through separate CLI processes
        run: python3 scripts/test-control-loop.py

      - name: Verify RPG snapshot recording and playback
        run: python3 scripts/test-rpg-replay.py

      - name: Verify file-backed RPG assets
        run: python3 scripts/test-rpg-assets.py

      - name: Verify copied standalone starter
        run: python3 scripts/test-starter.py

      - name: Check and drive headless collection room
        run: |
          cargo fmt --manifest-path games/collection-room/Cargo.toml --all --check
          cargo test --manifest-path games/collection-room/Cargo.toml --all-targets --all-features
          cargo clippy --manifest-path games/collection-room/Cargo.toml --all-targets --all-features -- -D warnings
          python3 games/collection-room/scripts/test-control.py

      - name: Check and drive independent arena game
        run: |
          cargo fmt --manifest-path games/arena/Cargo.toml --all --check
          cargo test --manifest-path games/arena/Cargo.toml --all-targets
          cargo clippy --manifest-path games/arena/Cargo.toml --all-targets --all-features -- -D warnings
          python3 games/arena/scripts/test-control.py

      - name: Verify real acceptance failure retention and cleanup
        run: python3 scripts/test-acceptance-failure-integration.py

      - name: Upload sanitized native acceptance failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-failures-${{ github.job }}-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/acceptance-failures/*/context.json
            target/acceptance-failures/*/commands.log
            target/acceptance-failures/*/runtime.log
            target/acceptance-failures/*/bundle.json
            target/acceptance-failures/*/api.txt
            target/acceptance-failures/*/capture.png
            target/acceptance-failures/*/latest-capture.ppm
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: false

  wasm:
    name: WebAssembly core check
    # 45-minute shared command budget + 10 minutes for evidence/actions cleanup.
    timeout-minutes: 55
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install stable Rust with WebAssembly target
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          rustup default stable

      - name: Identify Rust build cache
        id: rust-cache
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import hashlib, os, subprocess
          identity = subprocess.check_output(["rustc", "-vV"]) + os.environ.get("ImageOS", "").encode()
          print("version=" + hashlib.sha256(identity).hexdigest())
          PYTHON

      # Cache build outputs, never target/titan runtime captures or discovery data.
      # Copied games retain their own target directories and still build and run.
      - name: Cache Cargo downloads and Rust builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            target/debug
            target/wasm32-unknown-unknown
            target/starter-smoke/debug
            target/starter-smoke/wasm32-unknown-unknown
            games/arena/target/debug
            games/arena/target/wasm32-unknown-unknown
          key: rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.rust-cache.outputs.version }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.rust-cache.outputs.version }}-

      # The helper checks the executable version before reusing it. Copied
      # starter/arena builds also look here; do not cache the rest of target/titan.
      - name: Cache matching wasm-bindgen CLI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/titan/tools
          key: bindgen-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-cache.outputs.version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            bindgen-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-cache.outputs.version }}-

      - name: Check engine and protocol for WebAssembly
        run: cargo check -p titan -p titan-protocol -p titan-browser --target wasm32-unknown-unknown

      - name: Exercise collection room in actual WebAssembly
        run: |
          python3 games/collection-room/scripts/build-browser.py
          node games/collection-room/scripts/test-browser.mjs
          node --test games/collection-room/web/play/*.test.mjs

      - name: Exercise headless 3D primitives in actual WebAssembly
        run: node scripts/test-render-3d.mjs

      - name: Build actual browser 3D GPU verification fixture
        run: python3 scripts/build-render-3d-browser.py

      - name: Build the browser adapter and run the real WASM control loop
        run: |
          python3 scripts/build-browser.py
          node scripts/test-browser.mjs
          node scripts/test-rpg-replay.mjs
          node scripts/test-rpg-assets.mjs
          node --test web/inspector/*.test.mjs
          node --test web/shared/*.test.mjs
          node --test web/play/*.test.mjs

      - name: Build starter WASM and exercise its control loop
        run: |
          python3 scripts/test-starter.py --browser

      - name: Build arena WASM and exercise its control loop
        run: |
          cargo check --manifest-path games/arena/Cargo.toml --lib --target wasm32-unknown-unknown
          python3 games/arena/scripts/build-browser.py
          node games/arena/scripts/test-browser.mjs
          node --test games/arena/web/inspector/bridge.test.mjs
          node --test games/arena/web/play/*.test.mjs

  macos-bundles:
    name: macOS development app bundles
    # 45-minute shared command budget + 10 minutes for evidence/actions cleanup.
    timeout-minutes: 55
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Identify Rust build cache
        id: rust-cache
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import hashlib, os, subprocess
          identity = subprocess.check_output(["rustc", "-vV"]) + os.environ.get("ImageOS", "").encode()
          print("version=" + hashlib.sha256(identity).hexdigest())
          PYTHON

      # Cache build outputs, never target/titan runtime captures or discovery data.
      # Copied games retain their own target directories and still build and run.
      - name: Cache Cargo downloads and Rust builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            target/debug
            target/macos-bundle-smoke/debug
            games/arena/target/debug
          key: rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.rust-cache.outputs.version }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.rust-cache.outputs.version }}-

      - name: Build and run relocated bundles from copied games
        run: python3 scripts/test-macos-bundles.py

      - name: Verify native 3D shaders and offscreen readback
        env:
          TITAN_3D_EVIDENCE_DIR: ${{ runner.temp }}/titan-3d-evidence
        run: |
          cargo test -p titan-render-wgpu --test three_d -- --ignored
          cargo test -p titan-render-wgpu --test composition -- --ignored

      - name: Retain native 3D GPU comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: three-d-gpu-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/titan-3d-evidence/
          retention-days: 7
          if-no-files-found: ignore

      - name: Inspect and replay the actual native arena player
        run: python3 games/arena/scripts/test-live-player.py

      - name: Exercise native RPG recording playback
        run: |
          python3 scripts/test-rpg-replay.py --gpu
          python3 scripts/test-rpg-assets.py --gpu

      - name: Verify bounded acceptance failure evidence
        run: python3 scripts/test-acceptance-evidence.py

      - name: Exercise native RPG and arena control with failure evidence
        run: |
          python3 scripts/test-control-loop.py
          python3 games/arena/scripts/test-control.py

      - name: Verify real acceptance failure retention and cleanup
        run: python3 scripts/test-acceptance-failure-integration.py

      - name: Upload sanitized native acceptance failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-failures-${{ github.job }}-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/acceptance-failures/*/context.json
            target/acceptance-failures/*/commands.log
            target/acceptance-failures/*/runtime.log
            target/acceptance-failures/*/bundle.json
            target/acceptance-failures/*/api.txt
            target/acceptance-failures/*/capture.png
            target/acceptance-failures/*/latest-capture.ppm
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: false

name: Titan Demo

permissions:
  contents: read

on:
  merge_group:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTFLAGS: "-C debuginfo=0 -D warnings"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  headless-movement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-rust
        with:
          components: clippy
      - name: Test gameplay without the presentation feature or GPU dependencies
        run: cargo test -p titan_doom --no-default-features
      - name: Lint the headless feature combination
        run: cargo clippy -p titan_doom --no-default-features --all-targets -- -D warnings

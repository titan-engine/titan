name: Titan

permissions:
  contents: read

on:
  merge_group:
  pull_request:
  push:
    branches: [main, release-*]
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:

# Keep in sync with the repository's other Rust workflows.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTFLAGS: "-C debuginfo=0 -D warnings"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      upstream: ${{ steps.filter.outputs.upstream }}
      titan: ${{ steps.filter.outputs.titan }}
      docs: ${{ steps.filter.outputs.docs }}
      ecs: ${{ steps.filter.outputs.ecs }}
      titan_packages: ${{ steps.filter.outputs.titan_packages }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ci-changes
        id: filter

  titan-tests:
    needs: changes
    # Always emit the required check, including an explicit inapplicable result.
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TITAN_PACKAGES: ${{ needs.changes.result == 'success' && needs.changes.outputs.titan_packages || '*' }}
    steps:
      - name: No applicable Titan changes
        if: ${{ env.TITAN_PACKAGES == 'none' }}
        run: echo '## Titan tests — no applicable changes' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: ${{ env.TITAN_PACKAGES != 'none' }}
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ env.TITAN_PACKAGES != 'none' }}
        with:
          # key won't match, will rely on restore-keys
          key: ${{ runner.os }}-stable--${{ hashFiles('**/Cargo.toml') }}-
          # See .github/workflows/update-caches.yml for how keys are generated
          restore-keys: |
            ${{ runner.os }}-stable--${{ hashFiles('**/Cargo.toml') }}-
            ${{ runner.os }}-stable--
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
      - uses: ./.github/actions/install-rust
        if: ${{ env.TITAN_PACKAGES != 'none' }}
        with:
          components: clippy
      - uses: ./.github/actions/install-linux-deps
        if: ${{ env.TITAN_PACKAGES != 'none' }}
      - name: Test Titan crates with default features
        if: ${{ env.TITAN_PACKAGES != 'none' && needs.changes.outputs.upstream == 'false' }}
        run: bash .github/scripts/titan-scoped-ci.sh test "$TITAN_PACKAGES"
      # Default features remain covered by workspace tests on full runs.
      # New titan_* workspace crates automatically get all-features coverage.
      - name: Test selected Titan crates with extra features
        if: ${{ env.TITAN_PACKAGES != 'none' }}
        shell: bash
        run: bash .github/scripts/titan-scoped-ci.sh extra "$TITAN_PACKAGES"

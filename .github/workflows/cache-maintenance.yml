name: Cache Maintenance Tests

on:
  pull_request:
    paths:
      - .github/scripts/prune-actions-caches*
      - .github/scripts/cache-source-mtimes*
      - .github/scripts/titan-scoped-ci.sh
      - .github/scripts/test-titan-scoped-ci.sh
      - .github/workflows/ci.yml
      - .github/workflows/update-caches.yml
      - .github/workflows/cache-maintenance.yml
      - .github/scripts/titan-packages-changed*
      - .github/scripts/titan-test-features*
      - .github/scripts/titan-workflow*
  push:
    branches: [main]
    paths:
      - .github/scripts/prune-actions-caches*
      - .github/scripts/cache-source-mtimes*
      - .github/scripts/titan-scoped-ci.sh
      - .github/scripts/test-titan-scoped-ci.sh
      - .github/workflows/ci.yml
      - .github/workflows/update-caches.yml
      - .github/workflows/cache-maintenance.yml
      - .github/scripts/titan-packages-changed*
      - .github/scripts/titan-test-features*
      - .github/scripts/titan-workflow*

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Test cache pruning and source freshness without touching live caches
        run: node --test .github/scripts/prune-actions-caches.test.cjs .github/scripts/cache-source-mtimes.test.cjs
      - name: Test scoped CI arguments with native jq and LF/CRLF tool output
        shell: bash
        run: bash .github/scripts/test-titan-scoped-ci.sh
      - name: Test affected packages and Cargo feature routing without compilation
        run: node --test .github/scripts/titan-packages-changed.test.cjs .github/scripts/titan-test-features.test.cjs .github/scripts/titan-workflow.test.cjs

name: Cache Maintenance Tests

on:
  pull_request:
    paths:
      - .github/scripts/prune-actions-caches*
      - .github/workflows/update-caches.yml
      - .github/workflows/cache-maintenance.yml
  push:
    branches: [main]
    paths:
      - .github/scripts/prune-actions-caches*
      - .github/workflows/update-caches.yml
      - .github/workflows/cache-maintenance.yml

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Test cache pruning without touching live caches
        run: node --test .github/scripts/prune-actions-caches.test.cjs

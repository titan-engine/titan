name: Update Actions Caches

permissions:
  contents: read

on:
  # Manually
  workflow_dispatch:
  # On PR merge
  push:
    branches:
      - main
  # After nightly release
  schedule:
    - cron: "0 1 * * *"

# Serialize producers so overlapping pushes / nightly runs cannot replace or
# prune each other's caches. Finish the current save rather than cancelling it.
concurrency:
  group: update-actions-caches-main
  cancel-in-progress: false

# Environment variables must be kept in sync with all workflows that defines them.
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  # Keep in sync between all workflows
  RUSTFLAGS: "-C debuginfo=0 -D warnings"

jobs:
  env:
    runs-on: ubuntu-latest
    outputs:
      MSRV: ${{ steps.msrv.outputs.MSRV }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-rust
      - name: get MSRV
        id: msrv
        run: |
          msrv=$(cargo metadata --no-deps --format-version 1 | jq --raw-output '.packages[] | select(.name=="bevy") | .rust_version')
          echo "MSRV=$msrv" >> "$GITHUB_OUTPUT"

  build-caches:
    name: Build Caches
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      actions: write # Delete only this job's obsolete main-branch caches.
    needs: ["env"]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Keep one entry per OS/toolchain/target restore prefix. On 2026-10-09,
      # the latest entries totaled ~5.3 GB (11 populated prefixes including apt,
      # out of 13 produced). The two native nightly caches were absent due to
      # build failures. Budget ~1.3 GB for them: ~6.6 GB estimated steady state,
      # leaving ~3.4 GB below GitHub's 10 GB limit for replacements and #47's
      # larger test caches. Remeasure the complete set after #47: the <7 GB target
      # is not yet measured, and pruning bounds generations, not cache sizes.
      matrix:
        include:
          # ci.yml / build (ubuntu-latest), ci, check-compiles, check-doc, ...;
          # validation-jobs.yml / check-example-showcase-patches-still-work;
          # example-run.yml / run-examples-linux-vulkan
          - os: ubuntu-latest
            toolchain: stable
            target: ""
            cache-suffix: -workspace-tests-v1
          # ci.yml / build (macos-latest); example-run.yml / run-examples-macos-metal
          - os: macos-latest
            toolchain: stable
            target: ""
            cache-suffix: -workspace-tests-v1
          # ci.yml / build (windows-latest); example-run.yml / run-examples-on-windows-dx12
          - os: windows-latest
            toolchain: stable
            target: ""
            cache-suffix: -workspace-tests-v1
          # validation-jobs.yml / check-unused-dependencies
          - os: ubuntu-latest
            toolchain: nightly
            target: ""
          # ci.yml / msrv restores this exact toolchain, not stable.
          - os: ubuntu-latest
            toolchain: ${{ needs.env.outputs.MSRV }}
            target: ""
          # ci.yml / miri
          - os: macos-latest
            toolchain: nightly
            target: ""
          # ci.yml / build-wasm-atomics
          - os: ubuntu-latest
            toolchain: nightly
            target: wasm32-unknown-unknown
            components: rust-src
            rustflags: '-C debuginfo=0 -D warnings -C target-feature=+atomics,+bulk-memory --cfg getrandom_backend="wasm_js"'
            command: cargo check --target wasm32-unknown-unknown -Z build-std=std,panic_abort
          # ci.yml / build-wasm, and validation-jobs.yml / run-examples-on-wasm
          - os: ubuntu-latest
            toolchain: stable
            target: wasm32-unknown-unknown
            rustflags: '-C debuginfo=0 -D warnings --cfg getrandom_backend="wasm_js"'
            command: |
              cargo check --target wasm32-unknown-unknown
              cargo build --release --example testbed_ui --target wasm32-unknown-unknown
          # ci.yml / check-compiles-no-std and check-compiles-no-std-examples
          - os: ubuntu-latest
            toolchain: stable
            target: x86_64-unknown-none
            command: |
              cargo check -p bevy --no-default-features --features default_no_std --target x86_64-unknown-none
              cargo check -p bevy --no-default-features --features default_no_std,web --target x86_64-unknown-none
              cd examples/no_std/library && cargo check --no-default-features --features libm,critical-section --target x86_64-unknown-none
          # ci.yml / check-compiles-no-std-portable-atomic
          - os: ubuntu-latest
            toolchain: stable
            target: thumbv6m-none-eabi
            command: cargo check -p bevy --no-default-features --features default_no_std --target thumbv6m-none-eabi
          # validation-jobs.yml / build-android
          - os: ubuntu-latest
            toolchain: stable
            target: aarch64-linux-android
            command: |
              cargo install --force cargo-ndk
              cargo ndk -t arm64-v8a -P 26 -o android_example/app/src/main/jniLibs build --package bevy_mobile_example
          # validation-jobs.yml / build-and-install-on-iOS: keep the ~148 MB
          # registry-only cache (observed 4 s restore with no crate downloads).
          # Xcode has a separate target directory; no shared build artifacts.
          - os: macos-14
            toolchain: stable
            target: aarch64-apple-ios-sim

    steps:
      # prepare the date - used to rebuild the cache daily to update the cache for rust nightly, even if no change on Bevy dependencies
      - name: Get Date
        id: get-date
        run: |
          echo "date=$(/bin/date -u "+%Y%m%d")" >> "$GITHUB_OUTPUT"
        shell: bash

      # Use the dispatched revision so fixes can be verified before merging.
      # Push and scheduled runs still build main.
      - name: Checkout workflow revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/install-rust
        with:
          channel: ${{ matrix.toolchain }}
          target: ${{ matrix.target }}
          components: ${{ matrix.components }}

      # prepare the lockfile - to have a complete image of the dependencies on the current platform
      - name: Create lock file
        run: cargo update

      # Fetch the cache using the complete key - to avoid rebuilding the cache if nothing changed
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          # The suffix invalidates the old recipe even on a same-day rerun;
          # consumer restore prefixes and cache paths remain compatible.
          key: ${{ runner.os }}-${{ matrix.toolchain }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ steps.get-date.outputs.date }}${{ matrix.cache-suffix }}
          # Manual runs restore caches but still build to validate the selected revision.
          lookup-only: ${{ github.event_name != 'workflow_dispatch' }}

      - name: Fetch Rust dependencies
        if: steps.cache.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        run: cargo fetch

      - name: Install Linux dependencies
        if: steps.cache.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/install-linux-deps
        with:
          wayland: true
          xkb: true
          x264: true
          fontconfig: true

      # Build Bevy for the dev profile, used by check, doc, ...
      - name: Build dev cache
        if: matrix.target == '' && (steps.cache.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch')
        run: cargo build --profile dev --package bevy

      # Match ci.yml / build and tools/ci/src/commands/test.rs, without running
      # tests. Warm the CI runner too, so a leaf change does not rebuild it.
      - name: Build workspace test cache
        if: matrix.toolchain == 'stable' && matrix.target == '' && (steps.cache.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch')
        run: |
          cargo build --package ci
          cargo test --workspace --lib --bins --tests --features bevy_ecs/track_location --no-run

      # Since #46, only Linux compiles and runs the benchmark smoke tests.
      - name: Build workspace bench cache
        if: matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable' && matrix.target == '' && (steps.cache.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch')
        run: cargo test --workspace --benches --no-run

      # Preserve the non-stable native cache recipe for its other consumers.
      - name: Build test cache
        if: matrix.toolchain != 'stable' && matrix.target == '' && (steps.cache.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch')
        run: cargo build --profile test --package bevy

      - name: Build cross-target cache
        if: matrix.command != '' && (steps.cache.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch')
        run: ${{ matrix.command }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags || env.RUSTFLAGS }}

      - name: Save cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.toolchain }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ steps.get-date.outputs.date }}${{ matrix.cache-suffix }}

      # Also prune on an exact hit, so a rerun can finish interrupted cleanup.
      # Keep producer/consumer paths in sync. Mixed cache versions are left
      # intact with a warning; retire obsolete versions only after all consumers
      # migrate, to avoid losing hits.
      - name: Prune obsolete caches
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CACHE_PREFIX: ${{ runner.os }}-${{ matrix.toolchain }}-${{ matrix.target }}-
          CACHE_KEY: ${{ runner.os }}-${{ matrix.toolchain }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ steps.get-date.outputs.date }}${{ matrix.cache-suffix }}
        with:
          script: |
            const { prune } = require('./.github/scripts/prune-actions-caches.cjs');
            await prune({ github, context, core, prefix: process.env.CACHE_PREFIX, currentKey: process.env.CACHE_KEY });

  build-apt-cache:
    name: Build apt kisak/turtle Cache
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      actions: write # Delete only obsolete apt caches on main.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # prepare the date - used to rebuild the cache daily to catch new versions
      - name: Get Date
        id: get-date
        run: |
          echo "date=$(/bin/date -u "+%Y%m%d")" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Install llvmpipe and lavapipe
        run: |
          sudo apt-get update -y -qq
          sudo add-apt-repository ppa:kisak/turtle -y
          DEBIAN_FRONTEND=noninteractive sudo apt-get install --no-install-recommends -yq \
            libgl1-mesa-dri mesa-vulkan-drivers
          rm -rf ~/apt-cache; mkdir ~/apt-cache
          for package in libgbm1 libgl1-mesa-dri libglx-mesa0 mesa-libgallium libdisplay-info1 mesa-vulkan-drivers; do
              echo $package
              dpkg -L $package | while IFS= read -r f; do if test -f "$f"; then echo "$f"; fi; done | xargs -d '\n' cp --parents --target-directory ~/apt-cache/
          done

      - name: Save cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/apt-cache/
          key: ${{ runner.os }}-apt-kisak_turtle-${{ steps.get-date.outputs.date }}

      # example-run.yml / run-examples-linux-vulkan consumes this cache.
      - name: Prune obsolete caches
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CACHE_PREFIX: ${{ runner.os }}-apt-kisak_turtle-
          CACHE_KEY: ${{ runner.os }}-apt-kisak_turtle-${{ steps.get-date.outputs.date }}
        with:
          script: |
            const { prune } = require('./.github/scripts/prune-actions-caches.cjs');
            await prune({ github, context, core, prefix: process.env.CACHE_PREFIX, currentKey: process.env.CACHE_KEY });

name: Bug report
description: Tell us what went wrong and how to reproduce it.
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and environment
      description: Include your Titan revision, operating system, and steps or commands. A small example helps. Remove credentials and private data from logs; do not attach raw runtime discovery registrations.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context (optional)
      description: Screenshots, relevant logs, a workaround, or anything else that helps us investigate. It is fine if you do not know how to fix it.

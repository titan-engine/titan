name: Feature or investigation
description: Suggest an improvement or a question worth exploring.
labels: [investigation]
body:
  - type: markdown
    attributes:
      value: "Ideas are welcome. New issues enter Proposed so we can discuss scope before implementation. You do not need a complete design; maintainers help define acceptance criteria and dependencies. For usage questions, visit GitHub Discussions."
  - type: textarea
    id: outcome
    attributes:
      label: Problem or question
      description: What are you trying to do, and what is missing or difficult?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Suggested outcome (optional)
      description: What would a useful result look like? Examples or alternatives are welcome.
  - type: textarea
    id: boundaries
    attributes:
      label: Contribution interest (optional)
      description: Would you like to help investigate or implement this? Tell us if you need a starting point.
  - type: textarea
    id: relationships
    attributes:
      label: Related work (optional)
      description: Link relevant issues, examples, or docs if you know of any. Maintainers manage board status and blocking relationships.

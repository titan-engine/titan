name: Feature or investigation
description: Specify concrete work after discussion.
labels: [investigation]
body:
  - type: markdown
    attributes:
      value: |
        Brainstorm in local conversations or [GitHub Discussions](https://github.com/titan-engine/titan/discussions), then specify concrete work here. Do not commit planning files. Follow the [planning and issue intake policy](https://github.com/titan-engine/titan/blob/main/docs/workflow.md#planning-and-issue-intake).
        A well-specified issue enters Proposed and is not implementation approval. Maintainers record approval before Ready and help with triage. For a bug, use Bug report; for usage or contributor questions, use Discussions.
  - type: textarea
    id: outcome
    attributes:
      label: Outcome and problem
      description: What concrete result is needed, and what problem does it address? Link a public discussion or accepted requirement if relevant; do not publish private conversations.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance and verification
      description: What observable criteria establish success, and how will they be checked?
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Scope boundaries
      description: What is included and excluded from this work?
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Identify actual prerequisites, or state that none are known. Maintainers manage GitHub blocking relationships.
    validations:
      required: true
  - type: textarea
    id: approval
    attributes:
      label: Approval state
      description: State that maintainer approval is pending, or link the recorded maintainer agreement. Filing this issue does not authorize implementation.
    validations:
      required: true
  - type: textarea
    id: contribution
    attributes:
      label: Contribution interest (optional)
      description: Would you like to help investigate or implement this? Tell us if you need a starting point.

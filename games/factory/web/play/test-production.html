<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Factory browser production acceptance</title>
<style>body{background:#101519;color:#e6edf0;font:16px system-ui}iframe{width:1100px;height:1050px;border:0}pre{white-space:pre-wrap}</style>
<h1>Actual WASM and GPU production acceptance</h1><pre id="result">Running…</pre>
<iframe id="player" src="./?test=1"></iframe>
<script type="module">
const frame=document.querySelector('iframe'), result=document.querySelector('#result');
const assert=(condition,message)=>{if(!condition)throw new Error(message);};
const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
try {
  await new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
  const win=frame.contentWindow,doc=win.document;
  doc.querySelector('#start').click();
  for(let i=0;i<300&&!win.titanPlayerTest?.status();i++)await delay(100);
  const api=win.titanPlayerTest;
  assert(api?.status(),'GPU initialization failed: '+doc.querySelector('#error').textContent);
  api.step(0);doc.querySelector('#restart').click();
  const canvas=doc.querySelector('canvas');
  function click(x) {
    const rect=canvas.getBoundingClientRect();
    canvas.dispatchEvent(new win.PointerEvent('pointerdown',{bubbles:true,button:0,clientX:rect.left+(x*32+16)/384*rect.width,clientY:rect.top+112/256*rect.height}));
  }
  function build() {
    for(const [kind,xs] of [['extractor',[1]],['processor',[5]],['conveyor',[2,3,4,6,7,8,9]]]) {
      doc.querySelector(`[data-kind="${kind}"]`).click();xs.forEach(click);
    }
    assert(api.status().structures.length===10,'player pointer route construction');
    assert(api.status().tick===0 && api.status().seeded===0,'unseeded initial route');
  }
  build();
  const checkpoints=[];
  const structure=(state,x)=>state.structures.find(s=>s.x===x&&s.y===3);
  for(let tick=1;tick<=1269;tick++) {
    const state=api.step(1);
    const delivered=tick<189?0:1+Math.floor((tick-189)/120);
    assert(state.delivered===delivered,`delivery at ${tick}`);
    const resident=state.structures.reduce((sum,s)=>sum+Object.values(s.slots).filter(x=>x!==null).length,0);
    assert(state.extracted===resident+delivered && state.seeded===0,`independent accounting at ${tick}`);
    if(tick===60)assert(structure(state,1).slots.output==='ore','first extraction');
    if(tick===64)assert(structure(state,5).remaining===120 && structure(state,5).slots.in_process==='ore','first batch start');
    if(tick===124)assert(structure(state,5).slots.input==='ore','input backlog');
    if(tick===184)assert(structure(state,5).slots.output==='plate' && structure(state,5).remaining===120,'first plate and queued batch');
    if([60,64,124,184,189,1269].includes(tick)) {
      checkpoints.push(state);result.textContent=`Rendered tick ${tick}, delivered ${delivered}/10`;
      await delay(250);
    }
  }
  const completed=api.status();
  assert(completed.outcome==='Complete' && completed.completion_tick===1269,'complete at 1269');
  api.step(120);
  const frozen=api.status();
  for(const key of ['tick','completion_tick','structures','extracted','delivered','discarded_ore','discarded_plate'])assert(JSON.stringify(frozen[key])===JSON.stringify(completed[key]),`completion freezes ${key}`);
  try {api.command({op:'remove',x:1,y:3});throw new Error('completed edit accepted');}catch(error){assert(String(error).includes('COMPLETE'),'completed construction rejection');}
  doc.querySelector('#restart').click();
  const reset=api.status();
  assert(reset.tick===0&&reset.extracted===0&&reset.delivered===0&&reset.structures.length===1&&reset.completion_tick===null,'reset completed world');
  build();
  api.step(600);api.step(600);api.step(69);
  assert(api.status().completion_tick===1269,'rebuilt route reproduces completion');
  const evidence={ok:true,checks:['DOM player-built route','actual WASM/GPU frames','every-tick delivery and independent accounting','first extraction 60','first batch 64','queued input 124','first plate 184','first delivery 189','completion 1269','complete freeze and rejection','restart and rebuilt completion'],checkpoints,state:api.status()};
  const details=document.createElement('details'), summary=document.createElement('summary'), full=document.createElement('pre');
  summary.textContent='Full checkpoint and completion evidence';full.id='evidence';full.textContent=JSON.stringify(evidence,null,2);details.append(summary,full);document.body.append(details);
  result.textContent=JSON.stringify({ok:true,checks:evidence.checks,tick:evidence.state.tick,delivered:evidence.state.delivered,extracted:evidence.state.extracted},null,2);
  document.title='PASS — Factory browser production';
} catch(error) {result.textContent=error.stack??String(error);document.title='FAIL — Factory browser production';}
</script></html>

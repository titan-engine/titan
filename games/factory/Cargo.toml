[package]
name = "titan-factory"
default-run = "titan-factory"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
titan-diagnostics = { path = "../../crates/titan-diagnostics" }
titan = { path = "../..", features = ["browser-capture"] }
titan-protocol = { path = "../../crates/titan-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.127"
titan-render-wgpu = { path = "../../crates/titan-render-wgpu" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
titan-remote = { path = "../../crates/titan-remote" }
ctrlc = { version = "3", features = ["termination"] }
pollster = "0.4"
winit = "0.30"

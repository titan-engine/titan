[package]
name = "titan-collection-room"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
titan = { path = "../..", default-features = false }
titan-protocol = { path = "../../crates/titan-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.127"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
titan-remote = { path = "../../crates/titan-remote" }
titan-diagnostics = { path = "../../crates/titan-diagnostics" }
ctrlc = { version = "3", features = ["termination"] }

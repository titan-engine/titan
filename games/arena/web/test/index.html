<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Arena GPU replay verification</title>
<style>
body {margin:24px; background:#101519; color:#e6edf0; font:16px system-ui,sans-serif}
canvas {width:640px; max-width:100%; height:auto; image-rendering:pixelated; display:block; margin:16px 0}
button {font:inherit; padding:8px 12px; margin-right:8px} pre {white-space:pre-wrap}
</style>
<h1>Arena GPU replay verification</h1>
<p>Bounded integration fixture. Every run starts from the game’s restart operation.</p>
<button id="initial">Initial scene</button><button id="active">Pursuit at tick 240</button><button id="win">Replay survival</button><button id="loss">Idle loss</button>
<button id="dash">Dash active</button><button id="cooldown">Dash cooldown</button><button id="ready">Dash ready after held input</button>
<button id="live">Live inspection and recording</button>
<button id="seeking">Seeking and speed</button>
<button id="import-responsiveness">Replay import responsiveness</button>
<a id="import-output" hidden download="browser-output.json">Download import evidence</a>
<canvas id="canvas" width="640" height="448" aria-label="Arena GPU replay result"></canvas>
<pre id="result" role="status">Choose a scenario.</pre>
<script type="module">
import init, {BrowserPlayer, verify_recording_json} from '../inspector/pkg/titan_game.js';
const canvas = document.querySelector('canvas');
const result = document.querySelector('#result');
const buttons = [...document.querySelectorAll('button')];
const actions = ['up', 'down', 'left', 'right', 'dash'];
let player;
function route(tick) {
  if (tick < 30) return 'up';
  if (tick < 90) return 'right';
  const phase = (tick - 90) % 360;
  return phase < 60 ? 'down' : phase < 180 ? 'left' : phase < 240 ? 'up' : 'right';
}
async function run(ticks, moving, expected, dash = false) {
  buttons.forEach(button => button.disabled = true);
  try {
    await init();
    player ??= await BrowserPlayer.create(canvas);
    const previous = JSON.parse(player.status()).frame;
    player.restart();
    if (JSON.parse(player.status()).frame !== previous) throw new Error('Restart reset host clock');
    player.resume();
    for (let tick=0; tick<ticks; tick++) {
      for (const action of actions) player.set_action(action, dash ? action === 'dash' : moving && action === route(tick));
      player.frame(1000/60);
    }
    for (const action of actions) player.set_action(action, false);
    player.pause();
    player.frame(0);
    const state = JSON.parse(player.status());
    if (state.frame !== previous + ticks) throw new Error('Fixed frame count mismatch');
    for (const [key, value] of Object.entries(expected)) {
      if (state.run[key] !== value) throw new Error(`${key}: expected ${value}, got ${state.run[key]}`);
    }
    if (dash && (state.position.x !== (ticks === 1 ? 84 : 104) || state.position.y !== 65)) throw new Error('Dash trajectory mismatch');
    result.textContent = 'PASS\n' + JSON.stringify(state, null, 2);
  } catch (error) {
    result.textContent = 'FAIL: ' + (error.stack ?? error);
  } finally { buttons.forEach(button => button.disabled = false); }
}
document.querySelector('#initial').onclick = () => run(0, false, {outcome:'Running',health:3,elapsed:0,spawned:0});
document.querySelector('#active').onclick = () => run(240, true, {outcome:'Running',elapsed:240});
document.querySelector('#win').onclick = () => run(1200, true, {outcome:'Won',health:2,elapsed:1200,spawned:5});
document.querySelector('#loss').onclick = () => run(1200, false, {outcome:'Lost',health:0,elapsed:310});
document.querySelector('#dash').onclick = () => run(1, false, {dash_remaining:5,dash_cooldown:120,dash_ready:false}, true);
document.querySelector('#cooldown').onclick = () => run(6, false, {dash_remaining:0,dash_cooldown:115,dash_ready:false}, true);
document.querySelector('#ready').onclick = () => run(121, false, {dash_remaining:0,dash_cooldown:0,dash_ready:true}, true);
document.querySelector('#live').onclick = async () => {
  buttons.forEach(button => button.disabled = true);
  try {
    await init();
    player ??= await BrowserPlayer.create(canvas);
    player.set_control_enabled(false);
    player.restart(); player.resume();
    player.set_action('right', true); player.set_action('dash', true);
    player.frame(1000 / 60); player.pause(); player.frame(0);
    const visible = JSON.parse(player.status());
    let requestId = 0;
    const call = request => JSON.parse(player.handle(JSON.stringify({ schema_version: 1, request_id: `fixture-${++requestId}`, request })));
    const state = call({type:'query', name:'arena_state'});
    if (state.status !== 'success' || state.observed_frame !== visible.frame) throw new Error('Inspection is not at the presented frame');
    const denied = call({type:'step', frames:1});
    if (denied.status !== 'failure' || JSON.parse(player.status()).frame !== visible.frame) throw new Error('Read-only step was not rejected');
    const epoch = player.clock_epoch();
    const beforeOptIn = player.status();
    player.set_control_enabled(true);
    if (player.status() !== beforeOptIn) throw new Error('Control opt-in replaced or changed the session');
    const stepped = call({type:'step', frames:1});
    if (stepped.status !== 'success' || JSON.parse(player.status()).frame !== visible.frame + 1) throw new Error('Live step failed');
    const resumed = call({type:'invoke', name:'resume'});
    if (resumed.status !== 'success' || player.paused() || player.clock_epoch() === epoch) throw new Error('Resume did not reset host timing');
    const resumeEpoch = player.clock_epoch();
    const paused = call({type:'invoke', name:'pause'});
    if (paused.status !== 'success' || !player.paused() || player.clock_epoch() === resumeEpoch) throw new Error('Pause did not reset host timing');
    player.frame(0);
    const capture = call({type:'capture'});
    if (!capture.response?.artifact?.startsWith('data:image/png;base64,')) throw new Error('Live capture unavailable');
    const recording = call({type:'query', name:'recording'});
    if (recording.status !== 'success') throw new Error('Recording unavailable');
    const verified = JSON.parse(verify_recording_json(JSON.stringify(recording.response.value)));
    player.set_control_enabled(false);
    result.textContent = 'PASS\n' + JSON.stringify({visible, state, stepped, capture: {...capture, response: {...capture.response, artifact:'PNG data URI'}}, recording, verified}, null, 2);
  } catch (error) { result.textContent = 'FAIL: ' + (error.stack ?? error); }
  finally { buttons.forEach(button => button.disabled = false); }
};
document.querySelector('#seeking').onclick = async () => {
  buttons.forEach(button => button.disabled = true);
  try {
    await init();
    player ??= await BrowserPlayer.create(canvas);
    player.restart(); player.resume();
    for (let tick=0; tick<1200; tick++) {
      for (const action of actions) player.set_action(action, action === route(tick));
      player.frame(1000 / 60);
    }
    player.pause();
    let requestId = 0;
    const call = request => {
      const response = JSON.parse(player.handle(JSON.stringify({schema_version:1, request_id:`seek-${++requestId}`, request})));
      if (response.status !== 'success') throw new Error(JSON.stringify(response));
      return response.response;
    };
    const state = () => JSON.parse(player.playback_status());
    const check = (condition, message) => { if (!condition) throw new Error(message); };
    const recording = call({type:'query', name:'recording'}).value;
    const verified = JSON.parse(verify_recording_json(JSON.stringify(recording)));
    check(verified.checksum === 'b5cf61da6f50efd7', 'Canonical recording changed');
    player.load_recording(JSON.stringify(recording));
    player.set_playback_speed(0.25);
    player.resume();
    for (let frame=0; frame<4; frame++) player.frame(1000 / 60);
    check(state().position === 1, 'Quarter speed must consume one tick in four frames');
    player.pause();
    player.set_playback_speed(4);
    player.resume(); player.frame(1000 / 60); player.pause();
    check(state().position === 5, 'Four times speed must consume four ticks per frame');
    player.frame(1000 / 60);
    check(state().position === 5, 'Paused playback advanced');
    player.seek_playback(600);
    const requestedPosition = state().position;
    player.frame(0);
    check(state().position === requestedPosition, 'Render-only frame advanced a seek');
    for (const action of actions) player.set_action(action, true);
    player.pointer(8, 12, true); player.pointer(8, 12, false);
    let seekUpdates = 0;
    function finishSeek(target) {
      while (state().seeking) {
        const before = state().position;
        player.frame(1000 / 60);
        const advanced = state().position - before;
        check(advanced > 0 && advanced <= 120, 'Seek update exceeded tick budget');
        check(++seekUpdates <= 30, 'Seek did not finish');
      }
      check(state().position === target && player.paused(), 'Seek target/pause mismatch');
    }
    finishSeek(600);
    const middleSave = JSON.stringify(call({type:'query', name:'save'}).value);
    const middleChecksum = call({type:'capture'}).checksum;
    player.seek_playback(0); finishSeek(0);
    player.set_control_enabled(true);
    call({type:'step', frames:600});
    check(JSON.stringify(call({type:'query', name:'save'}).value) === middleSave, 'Seek and sequential state differ');
    check(call({type:'capture'}).checksum === middleChecksum, 'Seek and sequential pixels differ');
    player.seek_playback(50); finishSeek(50);
    player.set_playback_speed(0.5);
    player.seek_playback(1200); finishSeek(1200);
    check(state().verified, 'EOF verification failed after seeking');
    check(JSON.stringify(call({type:'query', name:'save'}).value) === JSON.stringify(verified.save), 'Final snapshot changed');
    check(call({type:'capture'}).checksum === verified.checksum, 'Final pixels changed');
    player.frame(0);
    result.textContent = 'PASS\n' + JSON.stringify({replay:state(), seekUpdates, checksum:verified.checksum, speedChecks:[0.25,4]}, null, 2);
  } catch (error) { result.textContent = 'FAIL: ' + (error.stack ?? error); }
  finally { buttons.forEach(button => button.disabled = false); }
};
document.querySelector('#import-responsiveness').onclick = async () => {
  buttons.forEach(button => button.disabled = true);
  try {
    const parameters = new URLSearchParams(location.search);
    const revision = parameters.get('revision');
    const dirty = parameters.get('working_tree_dirty');
    if (!/^[0-9a-f]{40}$/.test(revision ?? '') || !['true', 'false'].includes(dirty)) {
      throw new Error('Replay import evidence requires revision and working_tree_dirty URL parameters');
    }
    await init();
    player ??= await BrowserPlayer.create(canvas);
    player.set_control_enabled(true);
    let requestId = 0;
    const call = request => {
      const response = JSON.parse(player.handle(JSON.stringify({schema_version:1, request_id:`import-${++requestId}`, request})));
      if (response.status !== 'success') throw new Error(JSON.stringify(response));
      return response.response;
    };
    const makeRecording = ticks => {
      player.restart();
      call({type:'step', frames:ticks});
      const recording = call({type:'query', name:'recording'}).value;
      if (recording.recorded_ticks !== ticks || recording.truncated) throw new Error('Recording boundary mismatch');
      return recording;
    };
    const short = makeRecording(8);
    const maximum = makeRecording(3600);
    const encoder = new TextEncoder();
    const compact = JSON.stringify(maximum);
    const padding = 2 * 1024 * 1024 - encoder.encode(compact).byteLength;
    if (padding < 0) throw new Error('Maximum-tick recording exceeds import byte limit');
    const exactLimit = ' '.repeat(padding) + compact;
    if (encoder.encode(exactLimit).byteLength !== 2 * 1024 * 1024) throw new Error('Byte-limit fixture mismatch');
    const mismatch = JSON.stringify({...maximum, final_checksum:'0000000000000000'});
    const snapshot = () => JSON.stringify({
      status: player.status(),
      save: call({type:'query', name:'save'}).value,
      replay: player.playback_status(),
      checksum: call({type:'capture'}).checksum,
    });
    async function measure(label, recording, rejected = false) {
      const samples = [];
      for (let repeat = 0; repeat < 7; repeat++) {
        const before = rejected ? snapshot() : null;
        const started = performance.now();
        const timer = new Promise(resolve => setTimeout(() => resolve(performance.now() - started), 0));
        const frame = new Promise(resolve => requestAnimationFrame(() => resolve(performance.now() - started)));
        let outcome = 'success';
        let message = null;
        try { player.load_recording(recording); }
        catch (error) { outcome = 'failure'; message = String(error); }
        const callMs = performance.now() - started;
        const [timerDelayMs, animationFrameDelayMs] = await Promise.all([timer, frame]);
        const unchanged = rejected ? snapshot() === before : null;
        if ((outcome === 'failure') !== rejected || (rejected && !unchanged)) {
          throw new Error(`${label} result or nonmutation mismatch`);
        }
        samples.push({call_ms:callMs, timer_delay_ms:timerDelayMs,
          animation_frame_delay_ms:animationFrameDelayMs, outcome, message,
          rejected_session_unchanged:unchanged});
      }
      return {label, samples};
    }
    const report = {
      schema_version: 1,
      measured_at_utc: new Date().toISOString(),
      revision,
      working_tree_dirty: dirty === 'true',
      user_agent: navigator.userAgent,
      hardware_concurrency: navigator.hardwareConcurrency,
      profile: 'release WASM in a real browser GPU player',
      recording_bytes: {
        short: encoder.encode(JSON.stringify(short)).byteLength,
        max_ticks: encoder.encode(compact).byteLength,
        max_bytes: encoder.encode(exactLimit).byteLength,
      },
      measurement_scope: 'Synchronous load_recording call plus zero-delay timer and next animation-frame delivery from immediately before the call',
      cases: [
        await measure('short_valid', JSON.stringify(short)),
        await measure('max_ticks_valid', compact),
        await measure('max_bytes_valid', exactLimit),
        await measure('max_ticks_final_mismatch', mismatch, true),
      ],
    };
    const output = document.querySelector('#import-output');
    URL.revokeObjectURL(output.href);
    output.href = URL.createObjectURL(new Blob([JSON.stringify(report, null, 2) + '\n'], {type:'application/json'}));
    output.hidden = false;
    player.frame(0);
    result.textContent = 'PASS\n' + JSON.stringify(report, null, 2);
  } catch (error) { result.textContent = 'FAIL: ' + (error.stack ?? error); }
  finally { buttons.forEach(button => button.disabled = false); }
};
window.addEventListener('pagehide' , () => player?.free());
</script>
</html>

[package]
name = "dialogue"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
description = "A small dialogue validation tool for Titan"
repository = "https://github.com/titan-engine/titan"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "titan-tools"
path = "src/main.rs"

[dependencies]
titan-tools = { path = "../../crates/titan-tools" }

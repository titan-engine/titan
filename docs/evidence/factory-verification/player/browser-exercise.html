<!doctype html><html lang="en"><meta charset="utf-8"><title>Independent factory verification</title><style>body{background:#10191e;color:#eef;font:14px system-ui}iframe{width:1200px;height:850px;border:0}pre{max-height:200px;overflow:auto}</style><h1>Independent factory fault-and-repair exercise</h1><button id="narrow">900px layout</button><button id="snapshot">Snapshot current player</button><pre id="result">Starting</pre><iframe src="/play/?test=1"></iframe><script type="module">
const f=document.querySelector('iframe'),out=document.querySelector('#result');
const assert=(v,m)=>{if(!v)throw Error(m)}, wait=ms=>new Promise(r=>setTimeout(r,ms));
await new Promise(r=>f.addEventListener('load',r,{once:true}));const w=f.contentWindow,d=w.document;d.querySelector('#start').click();
try{for(let i=0;i<300&&!w.titanPlayerTest?.status();i++)await wait(100);const api=w.titanPlayerTest;assert(api?.status(),'start');
const snapshots=[],checks=[];const save=name=>{const state=api.status();snapshots.push({name,state});return state};
const button=id=>d.querySelector(id).click();const pick=k=>button(`[data-kind="${k}"]`);
const pointer=(x,y,action='pointerdown',button=0)=>{const c=d.querySelector('canvas'),r=c.getBoundingClientRect();c.dispatchEvent(new w.PointerEvent(action,{bubbles:true,button,clientX:r.left+(x*32+16)/384*r.width,clientY:r.top+(y*32+16)/256*r.height}));};
const tile=(s,x,y)=>s.structures.find(t=>t.x===x&&t.y===y);
const account=s=>{let n=0;for(const t of s.structures)for(const v of Object.values(t.slots))if(v==='ore'||v==='plate')n++;assert(s.extracted===n+s.delivered+s.discarded_ore+s.discarded_plate,'independent conservation')};
const step=n=>{for(let i=0;i<n;i++){button('#step');account(api.status())}};
button('#restart');pick('extractor');pointer(1,3);pick('conveyor');for(let x=2;x<=9;x++)pointer(x,3);
step(600);pointer(9,3,'pointerdown',2);let wrong=save('ore-at-delivery');assert(tile(wrong,9,3).connection.code==='wrong_type','ore diagnosed at delivery');assert(d.querySelector('#details').textContent.includes('Route ore through a processor'),'visible recipe repair');
button('[data-mode="remove"]');pointer(5,3,'pointermove');assert(api.status().preview.discarded_ore===1,'occupied belt discard preview');pointer(5,3);pick('processor');pointer(5,3);for(let x=6;x<=9;x++){button('[data-mode="remove"]');pointer(x,3);pick('conveyor');pointer(x,3);}step(600);pointer(5,3,'pointerdown',2);let processing=save('processor-repair');assert(processing.delivered>0&&processing.discarded_ore===5,'repair produces with explicit discard');
button('[data-mode="remove"]');pointer(5,3,'pointermove');const preview=api.status().preview;assert(preview.discarded_ore>=1,'processor in-process removal preview');const before=api.status();pointer(5,3);const after=save('processor-removed');assert(after.discarded_ore-before.discarded_ore===preview.discarded_ore&&after.discarded_plate-before.discarded_plate===preview.discarded_plate,'exact multi-slot discard');account(after);
pick('processor');pointer(5,3);for(let i=0;i<1800&&api.status().outcome==='Running';i++)step(1);let completed=save('repaired-complete');assert(completed.delivered===10&&completed.outcome==='Complete','completion after repeated repairs');assert(d.querySelector('#step').disabled,'complete disables step');
button('#restart');const reset=save('reset');assert(reset.tick===0&&reset.extracted===0&&reset.structures.length===1,'fresh reset');
// Fresh fault: processor faces south, then rotate twice more to north and once east.
pick('extractor');pointer(1,3);pick('conveyor');for(const x of [2,3,4,6,7,8,9])pointer(x,3);pick('processor');pointer(5,3);button('[data-mode="rotate"]');pointer(5,3);step(600);pointer(4,3,'pointerdown',2);let facing=save('wrong-facing');assert(tile(facing,4,3).connection.code==='wrong_facing','receiver face diagnosed');assert(d.querySelector('#details').textContent.includes('Rotate the receiver'),'visible facing repair');for(let i=0;i<3;i++)pointer(5,3);for(let i=0;i<1500&&api.status().outcome==='Running';i++)step(1);let end=save('facing-repaired-complete');assert(end.outcome==='Complete','rotated receiver recovers');
checks.push('DOM construction','wrong type diagnosis and recipe repair','occupied belt and multi-slot processor discard previews','per-tick conservation','facing diagnosis and rotation repair','completion controls','restart');
const result={ok:true,revision:'e4800939606889669e8a9b04650cda4bce6df37d',checks,snapshots};out.textContent=JSON.stringify(result);document.title='PASS independent factory';document.querySelector('#narrow').onclick=()=>{f.style.width='900px';api.resize();};document.querySelector('#snapshot').onclick=()=>{out.textContent=JSON.stringify({...result,current:api.status()})};
}catch(e){out.textContent=e.stack;document.title='FAIL independent factory'}
</script></html>

[package]
name = "titan_remote"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Titan time control and screenshot extensions for the Bevy Remote Protocol"
repository = "https://github.com/titan-engine/titan"
license = "MIT OR Apache-2.0"

[features]
default = []
render = [
  "dep:bevy_render",
  "dep:bevy_window",
  "dep:bevy_image",
  "dep:tempfile",
]

[dependencies]
bevy_app = { path = "../bevy_app", version = "0.20.0" }
bevy_ecs = { path = "../bevy_ecs", version = "0.20.0" }
bevy_diagnostic = { path = "../bevy_diagnostic", version = "0.20.0" }
bevy_remote = { path = "../bevy_remote", version = "0.20.0", default-features = false, features = [
  "http",
] }
bevy_time = { path = "../bevy_time", version = "0.20.0" }
bevy_render = { path = "../bevy_render", version = "0.20.0", optional = true }
bevy_window = { path = "../bevy_window", version = "0.20.0", optional = true }
bevy_image = { path = "../bevy_image", version = "0.20.0", optional = true, features = [
  "png",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.140"
tempfile = { version = "3", optional = true }

[dev-dependencies]
bevy = { path = "../..", version = "0.20.0", default-features = false, features = [
  "std",
  "async_executor",
  "bevy_log",
  "bevy_window",
  "bevy_winit",
  "bevy_render",
  "bevy_camera",
  "bevy_core_pipeline",
  "bevy_sprite",
  "bevy_sprite_render",
  "bevy_text",
  "png",
  "x11",
] }

[[example]]
name = "server"
required-features = ["render"]

[lints]
workspace = true

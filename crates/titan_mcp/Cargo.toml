[package]
name = "titan_mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Local MCP sidecar for inspecting and controlling Titan games over BRP"
license = "MIT OR Apache-2.0"
repository = "https://github.com/titan-engine/titan"
publish = false

[dependencies]
bevy_ecs = { path = "../bevy_ecs", version = "0.20.0" }
bevy_platform = { path = "../bevy_platform", version = "0.20.0", features = [
  "serialize",
] }
bevy_remote = { path = "../bevy_remote", version = "0.20.0", default-features = false, features = [
  "http",
] }
base64 = "0.22"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.140"
tempfile = "3"
ureq = { version = "3.0.8", default-features = false, features = ["json"] }

[dev-dependencies]
bevy_app = { path = "../bevy_app", version = "0.20.0" }
bevy_reflect = { path = "../bevy_reflect", version = "0.20.0" }
bevy_input = { path = "../bevy_input", version = "0.20.0", features = [
  "keyboard",
  "mouse",
  "bevy_reflect",
  "serialize",
] }
bevy_window = { path = "../bevy_window", version = "0.20.0" }

[lints]
workspace = true

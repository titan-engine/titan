[package]
name = "titan_determinism"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Locate nondeterminism in repeated headless Titan simulations"
repository = "https://github.com/titan-engine/titan"
license = "MIT OR Apache-2.0"
keywords = ["bevy", "titan", "determinism", "testing"]
categories = ["game-development", "development-tools::testing"]

[features]
default = []
track_location = ["bevy_ecs/track_location"]

[dependencies]
bevy_ecs = { path = "../bevy_ecs", version = "0.20.0", features = [
  "multi_threaded",
] }
bevy_reflect = { path = "../bevy_reflect", version = "0.20.0" }
titan_snapshot = { path = "../titan_snapshot", version = "0.1.0" }
titan_test = { path = "../titan_test", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
bevy_app = { path = "../bevy_app", version = "0.20.0" }
bevy_input = { path = "../bevy_input", version = "0.20.0" }
bevy_time = { path = "../bevy_time", version = "0.20.0" }
serde_json = "1.0.140"

[lints]
workspace = true

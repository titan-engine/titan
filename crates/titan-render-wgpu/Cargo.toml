[package]
name = "titan-render-wgpu"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Native and browser GPU sprite rendering for Titan."

[dependencies]
titan = { path = "../.." }
wgpu = { version = "30", features = ["webgl"] }
bytemuck = { version = "1", features = ["derive"] }

[dev-dependencies]
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
titan-protocol = { path = "../titan-protocol" }
futures-channel = "0.3"
titan-diagnostics = { path = "../titan-diagnostics" }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
titan = { path = "../..", features = ["browser-capture"] }
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Window", "Performance"] }

[[example]]
name = "three_d_browser"
crate-type = ["cdylib"]

[package]
name = "titan-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Command-line workflows and runtime inspection for Titan games."

[[bin]]
name = "titan"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
titan = { path = "../.." }
titan-protocol = { path = "../titan-protocol" }

titan-remote = { path = "../titan-remote" }

titan-diagnostics = { path = "../titan-diagnostics" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[package]
name = "titan-cli"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "titan"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
titan-protocol = { path = "../titan-protocol" }

